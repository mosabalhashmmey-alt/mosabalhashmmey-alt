name: Profile Health System

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - "README.md"
      - ".github/assets/**"
      - ".github/data/**"
      - ".github/scripts/check_profile_health.py"
      - ".github/workflows/profile-health.yml"

permissions:
  contents: read

jobs:
  health-check:
    name: Check Profile Health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Profile Health System
        run: |
          python .github/scripts/check_profile_health.py

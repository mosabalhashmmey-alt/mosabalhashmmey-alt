<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0B1023"/>
      <stop offset="75%" stop-color="#1D1B4B"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- ================= GLOW ORBS ================= -->

    <radialGradient
      id="orb1"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(930 72) rotate(90) scale(180 240)"
    >
      <stop stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient
      id="orb2"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(250 260) rotate(90) scale(160 220)"
    >
      <stop stop-color="#06B6D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- ================= NEON LINE ================= -->

    <linearGradient id="neonLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- ================= CARD BORDER ================= -->

    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.20"/>
    </linearGradient>

    <!-- ================= FILTERS ================= -->

    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ================= GRID ================= -->

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M32 0 L0 0 0 32"
        fill="none"
        stroke="#1E293B"
        stroke-opacity="0.55"
        stroke-width="1"
      />
    </pattern>

    <!-- ================= CRT SCAN LINES ================= -->

    <pattern id="scanPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#FFFFFF" fill-opacity="0.018"/>
    </pattern>

    <!-- ================= CLIP ================= -->

    <clipPath id="clipBanner">
      <rect x="0" y="0" width="1200" height="320" rx="22"/>
    </clipPath>

  </defs>


  <g clip-path="url(#clipBanner)">

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
    <rect width="1200" height="320" rx="22" fill="url(#scanPattern)"/>


    <!-- ================================================= -->
    <!-- MOVING GLOW ORBS -->
    <!-- ================================================= -->

    <ellipse cx="930" cy="72" rx="220" ry="170" fill="url(#orb1)">
      <animate
        attributeName="cx"
        values="930;900;930"
        dur="8s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="72;82;72"
        dur="7s"
        repeatCount="indefinite"
      />
    </ellipse>

    <ellipse cx="250" cy="260" rx="180" ry="130" fill="url(#orb2)">
      <animate
        attributeName="cx"
        values="250;285;250"
        dur="9s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="cy"
        values="260;245;260"
        dur="6s"
        repeatCount="indefinite"
      />
    </ellipse>


    <!-- ================================================= -->
    <!-- TOP NEON STRIP -->
    <!-- ================================================= -->


    [ SECURE NODE // MUSSAB.CORE ]
  </text>

  <text
    x="65"
    y="140"
    fill="#64748B"
    font-family="monospace"
    font-size="11"
  >
    encrypted channel established • access level: curious human
  </text>


  <!-- ======================================================= -->
  <!-- COMMAND 01 -->
  <!-- ======================================================= -->

  <g opacity="0">
    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.05;0.11;1"
      dur="8s"
      fill="freeze"
    />

    <text
      x="65"
      y="184"
      fill="#22D3EE"
      font-family="monospace"
      font-size="14"
      font-weight="700"

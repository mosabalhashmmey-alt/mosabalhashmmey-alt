      mussab@core:~$
    </text>

    <text
      x="190"
      y="184"
      fill="#E2E8F0"
      font-family="monospace"
      font-size="14"
    >
      whoami
    </text>

    <text
      x="88"
      y="208"
      fill="#A5B4FC"
      font-family="monospace"
      font-size="13"
    >
      Mussab Alhashmmey // developer • builder • explorer
    </text>
  </g>


  <!-- ======================================================= -->
  <!-- COMMAND 02 -->
  <!-- ======================================================= -->

  <g opacity="0">

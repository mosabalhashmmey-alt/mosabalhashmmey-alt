<svg
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- ===================================================== -->
    <!-- BACKGROUND -->
    <!-- ===================================================== -->

    <linearGradient id="terminalBg" x1="0" y1="0" x2="1200" y2="520">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#11112E"/>
    </linearGradient>

    <linearGradient id="neonBorder" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="72%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient
      id="purpleGlow"
      cx="0"
      cy="0"
      r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1020 80) rotate(90) scale(240 320)"
    >
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- ===================================================== -->
    <!-- GRID -->
    <!-- ===================================================== -->

    <pattern id="terminalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M32 0 L0 0 0 32"
        fill="none"
        stroke="#64748B"
        stroke-opacity="0.055"
        stroke-width="1"
      />
    </pattern>

    <!-- ===================================================== -->
    <!-- GLOW -->
    <!-- ===================================================== -->

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect x="31" y="31" width="1138" height="458" rx="18"/>
    </clipPath>

  </defs>


  <!-- ======================================================= -->
  <!-- OUTER FRAME -->
  <!-- ======================================================= -->

  <rect
    width="1200"
    height="520"
    rx="26"
    fill="url(#terminalBg)"
  />

  <rect
    width="1200"
    height="520"
    rx="26"
    fill="url(#terminalGrid)"
  />

  <rect
    width="1200"
    height="520"
    rx="26"
    fill="url(#purpleGlow)"
  />

  <rect
    x="1"
    y="1"
    width="1198"
    height="518"
    rx="25"
    fill="none"
    stroke="url(#neonBorder)"
    stroke-opacity="0.48"
    stroke-width="2"
  />


  <!-- ======================================================= -->
  <!-- TERMINAL WINDOW -->
  <!-- ======================================================= -->

  <rect
    x="30"
    y="30"
    width="1140"
    height="460"
    rx="18"
    fill="#02050D"
    fill-opacity="0.90"
    stroke="#334155"
    stroke-opacity="0.65"
  />


  <!-- ======================================================= -->
  <!-- TITLE BAR -->
  <!-- ======================================================= -->

  <rect
    x="30"
    y="30"
    width="1140"
    height="48"
    rx="18"
    fill="#07101F"
  />

  <rect
    x="30"
    y="60"
    width="1140"
    height="18"
    fill="#07101F"
  />

  <!-- Window controls -->

  <circle cx="58" cy="54" r="6" fill="#EF4444"/>
  <circle cx="80" cy="54" r="6" fill="#F59E0B"/>
  <circle cx="102" cy="54" r="6" fill="#22C55E"/>

  <text
    x="600"
    y="59"
    text-anchor="middle"
    fill="#94A3B8"
    font-family="monospace"
    font-size="12"
    letter-spacing="1"
  >
    mussab@deep-space: ~/.core/secret-terminal
  </text>

  <circle
    cx="1128"
    cy="54"
    r="4"
    fill="#22C55E"
    filter="url(#glow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ======================================================= -->
  <!-- MOVING SCAN LINE -->
  <!-- ======================================================= -->

  <g clip-path="url(#terminalClip)">

    <rect
      x="-260"
      y="79"
      width="240"
      height="410"
      fill="url(#scanGradient)"
      opacity="0.7"
    >
      <animate
        attributeName="x"
        values="-260;1220"
        dur="7s"
        repeatCount="indefinite"
      />
    </rect>

    <rect
      x="31"
      y="90"
      width="1138"
      height="2"
      fill="#22D3EE"
      opacity="0.07"
    >
      <animate
        attributeName="y"
        values="90;475;90"
        dur="9s"
        repeatCount="indefinite"
      />
    </rect>

  </g>


  <!-- ======================================================= -->
  <!-- BOOT HEADER -->
  <!-- ======================================================= -->

  <text
    x="65"
    y="115"
    fill="#8B5CF6"
    font-family="monospace"
    font-size="13"
    letter-spacing="1.5"

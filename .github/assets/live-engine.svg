<svg
    width="1200"
    height="590"
    viewBox="0 0 1200 590"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>

<defs>

    <linearGradient
        id="background"
        x1="0"
        y1="0"
        x2="1200"
        y2="590"
        gradientUnits="userSpaceOnUse"
    >
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="38%" stop-color="#071126"/>
        <stop offset="72%" stop-color="#18143F"/>
        <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <linearGradient
        id="neon"
        x1="0"
        y1="0"
        x2="1200"
        y2="0"
    >
        <stop offset="0%" stop-color="#22D3EE"/>
        <stop offset="45%" stop-color="#3B82F6"/>
        <stop offset="72%" stop-color="#8B5CF6"/>
        <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient
        id="bar"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
    >
        <stop offset="0%" stop-color="#0EA5E9"/>
        <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <radialGradient
        id="radarGlow"
        cx="0"
        cy="0"
        r="1"
        gradientUnits="userSpaceOnUse"
        gradientTransform="translate(962 265) rotate(90) scale(200)"
    >
        <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient
        id="radarSweep"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >
        <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.75"/>
        <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>

    <pattern
        id="grid"
        width="28"
        height="28"
        patternUnits="userSpaceOnUse"
    >
        <path
            d="M28 0 L0 0 0 28"
            fill="none"
            stroke="#64748B"
            stroke-opacity="0.08"
        />
    </pattern>

    <filter
        id="glow"
        x="-60%"
        y="-60%"
        width="220%"
        height="220%"
    >
        <feGaussianBlur
            stdDeviation="3"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>


